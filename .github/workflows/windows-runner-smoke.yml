name: Windows runner smoke

on:
  push:
    branches:
      - win-broker-probe-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Record runner and secret availability
        shell: pwsh
        env:
          PAYLOAD_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          $PSVersionTable | Out-String | Write-Host
          [Environment]::OSVersion | Out-String | Write-Host
          Write-Host ("HAS_PAYLOAD_KEY=" + (-not [string]::IsNullOrWhiteSpace($env:PAYLOAD_KEY_B64)))
